<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Campus resource finder{% endblock %}</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ee;color:#182d29;font:1rem/1.55 system-ui,sans-serif}header,main{max-width:52rem;margin:auto;padding:1.5rem}header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;border-bottom:1px solid #b9c7ba}nav{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}a{color:#125244}h1,h2{font-family:Georgia,serif;line-height:1.15}h1{font-size:clamp(2rem,5vw,3.75rem)}section{margin:2rem 0}input{max-width:100%;padding:.6rem;border:1px solid #678476;border-radius:.25rem}button{background:#174c40;color:white;padding:.65rem 1rem;border:0;border-radius:.25rem;cursor:pointer}li{margin:.5rem 0}article{background:white;border:1px solid #bccac3;padding:1rem;margin:.6rem 0}article h3{margin:0}.errorlist{color:#9c2727}form div{margin:.75rem 0}label{display:block;font-weight:600}
</style></head><body><header><strong>Campus resource finder</strong><nav>{% if user.is_authenticated %}<a href="/">Finder</a><a href="/account/">Display name</a><a href="/password/">Password</a><form method="post" action="/logout/">{% csrf_token %}<button>Sign out</button></form>{% else %}<a href="/login/">Sign in</a><a href="/signup/">Create account</a>{% endif %}</nav></header><main>{% block content %}{% endblock %}</main></body></html>
